<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brasil 2026 en datos — placas</title>
<link rel="stylesheet" href="fonts/fonts.css?v=23">
<link rel="stylesheet" href="css/placas.css?v=23">
</head>
<body>
<div id="escenario"></div>
<script>
  // Carga en orden y reintenta si un archivo falla (algunos antivirus cortan descargas locales).
  (function () {
    const V = 23;
    const archivos = ['data/series.js', 'data/encuestas.js', 'data/elecciones-2022.js', 'js/geo-br.js', 'js/charts.js', 'js/mapa.js', 'js/placas.js'];
    function cargar(i, intento) {
      if (i >= archivos.length) return;
      const s = document.createElement('script');
      s.src = `${archivos[i]}?v=${V}` + (intento ? `&r=${intento}` : '');
      s.onload = () => cargar(i + 1, 0);
      s.onerror = () => {
        s.remove();
        if (intento < 6) setTimeout(() => cargar(i, intento + 1), 300 * (intento + 1));
        else if (archivos[i] === 'data/encuestas.js') cargar(i + 1, 0);  // opcional: sin encuestas, sigue
        else document.body.insertAdjacentHTML('beforeend', `<p style="font:20px sans-serif;padding:30px">No se pudo cargar ${archivos[i]}. Recargá la página (F5).</p>`);
      };
      document.body.appendChild(s);
    }
    cargar(0, 0);
  })();
</script>
</body>
</html>
