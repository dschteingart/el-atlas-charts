<style>
  .wrap-wide { max-width: 1100px; padding: 10px 20px 16px; }
  .wrap-wide header { padding-bottom: 8px; margin-bottom: 10px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: flex-end; margin: 14px 0 10px; }
  .ctl label { display: block; font-family: var(--sans); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-muted); margin-bottom: 5px; }
  select { font-family: var(--sans); font-size: 13.5px; padding: 7px 9px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); color: var(--ink); max-width: 210px; }
  /* chips + buscador de la casa: .m-search-* y .m-selected-chip de lib/style.css */
  .m-search-wrap { margin: 2px 0 0; }
  .pod-acciones { display: flex; align-items: center; gap: 10px; margin: 2px 0 0; }
  /* botones de region: toggle que suma/quita la region entera */
  .pod-regiones { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
  .reg-btn { display: inline-flex; align-items: center; gap: 6px; font-family: var(--sans); font-size: 12px; padding: 4px 11px; border: 1px solid var(--rule); border-radius: 999px; background: var(--bg); color: var(--ink-soft); cursor: pointer; }
  .reg-btn:hover { border-color: var(--ink-soft); color: var(--ink); }
  .reg-btn .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .reg-btn.on { color: #fff; }
  .reg-btn.on .dot { background: rgba(255,255,255,0.6) !important; }
  /* doble slider de periodo */
  .anios { display: flex; align-items: center; gap: 8px; }
  .anios input[type=number] { font-family: var(--sans); font-size: 13px; width: 72px; padding: 5px 6px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); color: var(--ink); }
  .dual { position: relative; width: 220px; height: 26px; }
  .dual .track { position: absolute; top: 11.5px; left: 0; right: 0; height: 3px; background: var(--rule); border-radius: 2px; }
  .dual .fill { position: absolute; top: 11.5px; height: 3px; background: var(--accent); border-radius: 2px; }
  .dual input[type=range] { position: absolute; left: 0; top: 0; width: 100%; height: 26px; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
  .dual input[type=range]::-webkit-slider-runnable-track { height: 3px; background: transparent; }
  .dual input[type=range]::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--rule); cursor: pointer; margin-top: -6.5px; }
  .dual input[type=range]::-moz-range-track { height: 3px; background: transparent; }
  .dual input[type=range]::-moz-range-thumb { pointer-events: auto; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--rule); cursor: pointer; }
  /* tabla de podios */
  .tblbox { max-height: 680px; overflow: auto; border: 1px solid var(--rule); border-radius: 10px; }
  table { border-collapse: collapse; font-family: var(--sans); width: 100%; min-width: 880px; }
  thead th { position: sticky; top: 0; background: var(--bg); z-index: 2; }
  th, td { padding: 8px 12px; font-size: 13.5px; border-bottom: 1px solid var(--rule); text-align: left; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-muted); font-weight: 700; white-space: nowrap; }
  td.pais { font-weight: 700; color: var(--ink); white-space: nowrap; }
  td.fig .fw { display: flex; align-items: center; gap: 9px; }
  td.fig .ph { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; object-position: top; background: var(--grid); border: 1px solid var(--rule); flex: 0 0 auto; }
  .ph-off { display: inline-block; }   /* placeholder cuando no hay retrato */
  td.fig .fn { font-weight: 600; color: var(--ink); font-size: 13.5px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.fig .fm { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  td.fig .fm b { color: var(--accent); font-variant-numeric: tabular-nums; }
  td.vac { color: var(--ink-muted); }
  td.vacio { color: var(--ink-muted); font-style: italic; }
  #aviso { font-family: var(--sans); font-size: 12px; color: var(--ink-muted); margin: 8px 0 0; }

<div class="wrap wrap-wide">

</div>

<div class="tooltip" id="tt" style="display:none"></div>

<script src="../lib/i18n.js"></script>
<script src="../lib/regions.js"></script>

<script src="./utils.js?v=7"></script>
<script src="./data-top.js?v=11"></script>
<script>
const D = window.TOPFIGS;
const en = () => (typeof LANG !== 'undefined' && LANG === 'en');
const loc = () => en() ? 'en-US' : 'es-AR';
const tpl = (k, vars) => Object.entries(vars).reduce((a, [b, c]) => a.split('{' + b + '}').join(c), t(k));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const fmtAnio = y => y < 0 ? (-y).toLocaleString(loc()) + (en() ? ' BC' : ' a.C.') : String(y);
const fmtHpi = v => v.toLocaleString(loc(), { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const paisLabel = i => en() ? D.isoMeta[i].en : D.isoMeta[i].es;
const LATAM = D.isoMeta.map((m, i) => [m, i]).filter(([m]) => m.reg === 'Latin America').map(([, i]) => i);

const st = { sel: LATAM.slice(), y0: 1900, y1: 2025, dom: -1, occ: -1, gen: '' };

// ===== periodo: doble slider con escala por tramos (lo moderno con mas lugar) =====
const ANC = [[0, -4000], [250, 0], [500, 1500], [1000, 2025]];
function s2y(s) {
  s = +s;
  for (let k = 1; k < ANC.length; k++) if (s <= ANC[k][0]) {
    const s0 = ANC[k - 1][0], y0 = ANC[k - 1][1], s1 = ANC[k][0], y1 = ANC[k][1];
    return Math.round(y0 + (s - s0) * (y1 - y0) / (s1 - s0));
  }
  return ANC[ANC.length - 1][1];
}
function y2s(y) {
  y = Math.max(-4000, Math.min(2025, +y));
  for (let k = 1; k < ANC.length; k++) if (y <= ANC[k][1]) {
    const s0 = ANC[k - 1][0], y0 = ANC[k - 1][1], s1 = ANC[k][0], y1 = ANC[k][1];
    return s0 + (y - y0) * (s1 - s0) / (y1 - y0);
  }
  return ANC[ANC.length - 1][0];
}
function syncPeriodo() {
  document.getElementById('n-y0').value = st.y0;
  document.getElementById('n-y1').value = st.y1;
  const s0 = y2s(st.y0), s1 = y2s(st.y1);
  document.getElementById('r-y0').value = s0;
  document.getElementById('r-y1').value = s1;
  const f = document.getElementById('fill');
  f.style.left = (s0 / 10) + '%';
  f.style.width = Math.max(0, (s1 - s0) / 10) + '%';
}

// ===== selects dominio -> ocupacion (dependientes, como en el ranking) =====
function fillSelects() {
  const sd = document.getElementById('c-dom'), so = document.getElementById('c-occ');
  sd.innerHTML = ''; sd.add(new Option(t('pod-todos'), -1));
  D.doms.forEach((d, i) => sd.add(new Option(en() ? d.en : d.es, i)));
  sd.value = String(st.dom);
  so.innerHTML = ''; so.add(new Option(t('pod-todas'), -1));
  D.occs.map((o, i) => [o, i])
    .filter(([o]) => st.dom < 0 || o.dom === st.dom)
    .sort((a, b) => (en() ? a[0].en : a[0].es).localeCompare(en() ? b[0].en : b[0].es, loc()))
    .forEach(([o, i]) => so.add(new Option(en() ? o.en : o.es, i)));
  so.value = String(st.occ);
  if (so.value === '') { st.occ = -1; so.value = '-1'; }
  const sg = document.getElementById('c-gen');
  sg.innerHTML = '';
  sg.add(new Option(t('gen-todos'), ''));
  sg.add(new Option(t('gen-f'), 'F'));
  sg.add(new Option(t('gen-m'), 'M'));
  sg.value = st.gen;
}

// ===== chips + buscador de paises (mismo patron que el explorador) =====
function renderChips() {
  const box = document.getElementById('pod-selected-chips'); box.innerHTML = '';
  st.sel.forEach(i => {
    const m = D.isoMeta[i];
    const chip = document.createElement('span');
    chip.className = 'm-selected-chip';
    chip.style.background = (typeof REGION_COLORS !== 'undefined' && REGION_COLORS[m.reg]) || '#888';
    chip.textContent = paisLabel(i);
    const x = document.createElement('button');
    x.className = 'm-chip-x'; x.innerHTML = '\u00d7'; x.setAttribute('aria-label', 'Quitar');
    x.addEventListener('click', () => { st.sel = st.sel.filter(v => v !== i); renderChips(); render(); });
    chip.appendChild(x); box.appendChild(chip);
  });
  document.getElementById('pod-search').placeholder = t('pod-buscar');
  renderRegBtns();
}
// un boton por region: agrega sus paises; si ya estan todos, los quita (toggle)
function renderRegBtns() {
  const box = document.getElementById('pod-regiones'); box.innerHTML = '';
  REGION_ORDER.forEach(reg => {
    const idxs = [];
    D.isoMeta.forEach((m, i) => { if (m.reg === reg) idxs.push(i); });
    if (!idxs.length) return;
    const full = idxs.every(i => st.sel.includes(i));
    const col = REGION_COLORS[reg] || '#888';
    const b2 = document.createElement('button');
    b2.className = 'reg-btn' + (full ? ' on' : '');
    if (full) { b2.style.background = col; b2.style.borderColor = col; }
    const dot = document.createElement('span');
    dot.className = 'dot'; dot.style.background = col;
    b2.appendChild(dot);
    b2.appendChild(document.createTextNode(t('reg.' + reg)));
    b2.addEventListener('click', () => {
      if (full) st.sel = st.sel.filter(i => !idxs.includes(i));
      else idxs.forEach(i => { if (!st.sel.includes(i)) st.sel.push(i); });
      renderChips(); render();
    });
    box.appendChild(b2);
  });
}
const normTxt = x => x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function setupSearch() {
  const input = document.getElementById('pod-search');
  const results = document.getElementById('pod-search-results');
  let matches = [], activeIdx = -1;
  // solo paises con region: fuera los codigos sin meta (SUN, YUG, AIA...)
  const lista = () => D.isoMeta.map((m, i) => ({ m, i })).filter(x => x.m.reg)
    .sort((a2, b2) => paisLabel(a2.i).localeCompare(paisLabel(b2.i), loc()));
  function toggle(i) {
    if (st.sel.includes(i)) st.sel = st.sel.filter(v => v !== i);
    else st.sel.push(i);
    renderChips(); render();
  }
  function getMatches(q) {
    if (!q) return [];
    const qn = normTxt(q);
    return lista().filter(x => normTxt(paisLabel(x.i)).includes(qn)).slice(0, 8);
  }
  function paint() {
    if (!matches.length) { results.innerHTML = ''; results.classList.remove('open'); return; }
    results.innerHTML = matches.map((x, k) => {
      const cls = 'm-search-result' + (k === activeIdx ? ' m-active' : '') + (st.sel.includes(x.i) ? ' m-already' : '');
      return '<div class="' + cls + '" data-i="' + x.i + '">' + esc(paisLabel(x.i)) +
        '<span class="m-search-region">' + esc(t('reg.' + x.m.reg)) + '</span></div>';
    }).join('');
    results.classList.add('open');
    results.querySelectorAll('.m-search-result').forEach(el => {
      el.addEventListener('click', () => {
        toggle(+el.dataset.i); input.value = ''; results.classList.remove('open'); input.focus();
      });
    });
  }
  input.addEventListener('input', () => {
    matches = getMatches(input.value);
    activeIdx = matches.length ? 0 : -1;
    paint();
  });
  input.addEventListener('keydown', ev => {
    if (!results.classList.contains('open')) return;
    if (ev.key === 'ArrowDown') { ev.preventDefault(); activeIdx = (activeIdx + 1) % matches.length; paint(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); activeIdx = (activeIdx - 1 + matches.length) % matches.length; paint(); }
    else if (ev.key === 'Enter' && activeIdx >= 0) { ev.preventDefault(); toggle(matches[activeIdx].i); input.value = ''; results.classList.remove('open'); }
    else if (ev.key === 'Escape') { results.classList.remove('open'); input.blur(); }
  });
  document.addEventListener('click', ev => {
    if (!input.contains(ev.target) && !results.contains(ev.target)) results.classList.remove('open');
  });
}

// ===== podios =====
function nombre(r) { return en() ? r[1] : (r[2] || r[1]); }
function occLabel(r) {
  const o = D.occs[r[4]];
  if (en()) return o.en;
  return r[8] === 'F' ? (o.es_f || o.es) : r[8] === 'M' ? (o.es_m || o.es) : o.es;
}
function fotoUrl(r) {
  if (!r[7]) return null;
  if (/^\d+\.(jpg|png)$/.test(r[7])) return './fotos/' + r[7];
  return 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(r[7]) + '?width=96';
}
function calc() {
  const setSel = new Set(st.sel);
  const top = new Map();
  for (const r of D.rows) {                     // ya vienen ordenadas por rank
    if (r[3] < 0 || !setSel.has(r[3])) continue;
    if (r[6] == null || r[6] < st.y0 || r[6] > st.y1) continue;
    if (st.occ >= 0) { if (r[4] !== st.occ) continue; }
    else if (st.dom >= 0 && D.occs[r[4]].dom !== st.dom) continue;
    if (st.gen && r[8] !== st.gen) continue;
    let a = top.get(r[3]);
    if (!a) top.set(r[3], a = []);
    if (a.length < 3) a.push(r);
  }
  const out = st.sel.map(i => ({ i, figs: top.get(i) || [] }));
  out.sort((a, b) => ((b.figs[0] ? b.figs[0][5] : -1) - (a.figs[0] ? a.figs[0][5] : -1))
    || paisLabel(a.i).localeCompare(paisLabel(b.i), loc()));
  return out;
}
function filtroDomStr() {
  const partes = [];
  if (st.gen) partes.push(t(st.gen === 'F' ? 'gen-f' : 'gen-m'));
  if (st.occ >= 0) partes.push(en() ? D.occs[st.occ].en : D.occs[st.occ].es);
  else if (st.dom >= 0) partes.push(en() ? D.doms[st.dom].en : D.doms[st.dom].es);
  return partes.join(' · ');
}
function subActual() {
  const f = filtroDomStr();
  const v = { y0: fmtAnio(st.y0), y1: fmtAnio(st.y1), f: f };
  return f ? tpl('pod-subtitle-dom', v) : tpl('pod-subtitle', v);
}
function syncSub() {
  const ae = (window.AtlasEditor && window.AtlasEditor.getConfig) ? window.AtlasEditor.getConfig() : null;
  const tx = (ae && ae.texts && ae.texts[en() ? 'en' : 'es']) || {};
  if (!(tx.subtitle || '').trim()) document.querySelector('.chart-subtitle').textContent = subActual();
}
function phOff(img) {   // criterio comun: sin retrato queda el circulo neutro
  const sp = document.createElement('span'); sp.className = 'ph ph-off'; img.replaceWith(sp);
}
function celda(r) {
  if (!r) return '<td class="fig vac">—</td>';
  const ph = fotoUrl(r);
  return '<td class="fig" data-rk="' + r[0] + '"><div class="fw">' +
    (ph ? '<img class="ph" loading="lazy" referrerpolicy="no-referrer" src="' + ph + '" alt="" onerror="phOff(this)">'
        : '<span class="ph ph-off"></span>') +
    '<div class="ft"><div class="fn">' + esc(nombre(r)) + '</div>' +
    '<div class="fm">' + esc(occLabel(r)) + ' · <b>' + fmtHpi(r[5]) + '</b></div></div></div></td>';
}
function render() {
  pod_syncUrl();
  document.getElementById('h-pais').textContent = t('pod-col-pais');
  const ord = en() ? ['1st', '2nd', '3rd'] : ['1°', '2°', '3°'];
  ['h-p1', 'h-p2', 'h-p3'].forEach((id, k) => { document.getElementById(id).textContent = ord[k]; });
  const tb = document.getElementById('rows'); tb.innerHTML = '';
  if (!st.sel.length) {
    tb.innerHTML = '<tr><td class="vacio" colspan="4">' + esc(t('pod-vacio')) + '</td></tr>';
  } else {
    calc().forEach(p => {
      const tr = document.createElement('tr');
      if (!p.figs.length) {
        tr.innerHTML = '<td class="pais">' + esc(paisLabel(p.i)) + '</td>' +
          '<td class="vacio" colspan="3">' + esc(t('pod-sin-figuras')) + '</td>';
      } else {
        tr.innerHTML = '<td class="pais">' + esc(paisLabel(p.i)) + '</td>' +
          celda(p.figs[0]) + celda(p.figs[1]) + celda(p.figs[2]);
      }
      tb.appendChild(tr);
    });
  }
  const av = document.getElementById('aviso');
  if (!window.__full) { av.hidden = false; av.textContent = t('pod-cargando'); }
  else av.hidden = true;
  syncSub();
}

// ===== CSV =====
function csvActual() {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const head = ['country', 'iso3', 'position', 'rank_global', 'name_en', 'name_es', 'occupation', 'domain', 'birthyear', 'hpi_0_100'];
  const lines = [head.join(',')];
  calc().forEach(p => {
    const m = D.isoMeta[p.i];
    p.figs.forEach((r, k) => {
      const o = D.occs[r[4]];

// ===== PNG (cuadrado 1200, mobile-first, minimalista) =====
const PNG = { W: 1200, H: 1200, bg: '#FAF8F3', ink: '#1A1A1A', soft: '#4A4A4A', muted: '#8A8579', rule: '#E0DCC8', accent: '#BE5D32' };
const SERIF = '"Source Serif 4", Georgia, serif';
const SANS = '"Source Sans 3", Arial, sans-serif';
function wrapText(ctx, text, maxW) {
  const w = String(text).split(' '), out = []; let cur = '';
  w.forEach(x => { const p = cur ? cur + ' ' + x : x; if (ctx.measureText(p).width > maxW && cur) { out.push(cur); cur = x; } else cur = p; });
  if (cur) out.push(cur); return out;
}
// Nombre largo: se abrevia con inicial, no se parte ni se recorta con puntos
// suspensivos (Daniel 2026-09-15). "Gabriel Garcia Marquez" -> "G. Garcia
// Marquez", "Maria Corina Machado" -> "M. Corina Machado". Se abrevia de a un
// nombre de pila por vez, nunca el apellido final ni las particulas.
const PARTICULA = /^(de|del|la|las|los|le|van|von|da|das|dos|do|di|du|el|y|e|bin|ibn|al|ben|san|santa|mc|o')$/i;
// El apodo va entre comillas y es UNA pieza: partiendo por espacios,
// 'Joaquín "El Chapo" Guzmán' salia como 'J. ". C. Guzmán' (Daniel 2026-09-15).
// Las comillas simples no cuentan: son apostrofes de apellido (O'Neal, de' Medici).
const tokenizarNombre = (s) => String(s).match(/"[^"]*"|[\u201c][^\u201d]*[\u201d]|[\u00ab][^\u00bb]*[\u00bb]|\S+/g) || [];
const esApodo = (t) => /^["\u201c\u00ab]/.test(t);
const abreviarNombre = (ctx, s, maxW) => {
  s = String(s);
  if (ctx.measureText(s).width <= maxW) return s;
  // abrevia de a un nombre de pila por vez; nunca el ultimo, ni el apodo, ni las particulas
  const escalera = (w) => {
    for (let k = 1; k < w.length; k++) {
      const cand = w.map((x, i) => (i < k && !esApodo(x) && !PARTICULA.test(x)) ? x.charAt(0) + '.' : x).join(' ');
      if (ctx.measureText(cand).width <= maxW) return cand;
    }
    return null;
  };
  const w = tokenizarNombre(s);
  let r = escalera(w);
  if (r) return r;
  // si con iniciales tampoco entra, el apodo se cae entero antes que quedar roto
  const sinApodo = w.filter(x => !esApodo(x));
  if (sinApodo.length && sinApodo.length < w.length) {
    const plano = sinApodo.join(' ');
    if (ctx.measureText(plano).width <= maxW) return plano;
    r = escalera(sinApodo);
    if (r) return r;
  }
  return fitText(ctx, s, maxW);
};
// El pais sigue pudiendo ir en dos renglones: debajo no lleva nada.
const partirNombre = (ctx, s, maxW) => {
  s = String(s);
  if (ctx.measureText(s).width <= maxW) return [s];
  const w = s.split(/\s+/);
  if (w.length < 2) return [fitText(ctx, s, maxW)];
  let mejor = null, dif = Infinity;
  for (let k = 1; k < w.length; k++) {
    const a1 = w.slice(0, k).join(' '), b1 = w.slice(k).join(' ');
    const wa = ctx.measureText(a1).width, wb = ctx.measureText(b1).width;
    if (Math.max(wa, wb) > maxW) continue;
    const d = Math.abs(wa - wb);
    if (d < dif) { dif = d; mejor = [a1, b1]; }
  }
  return mejor || [fitText(ctx, s, maxW)];
};
// Cuerpo UNICO para toda una columna: el mayor tamano al que TODA la columna
// entra en uno o dos renglones. La version anterior achicaba de a una figura,
// asi que un nombre quedaba de otro cuerpo al lado del resto y encima seguia
// saliendo cortado (Daniel 2026-09-15).
const cabeEnDos = (ctx, s, maxW) => {
  s = String(s);
  if (ctx.measureText(s).width <= maxW) return true;
  const w = s.split(/\s+/);
  for (let k = 1; k < w.length; k++) {
    if (ctx.measureText(w.slice(0, k).join(' ')).width <= maxW
        && ctx.measureText(w.slice(k).join(' ')).width <= maxW) return true;
  }
  return false;
};
const fitFontComun = (ctx, lista, maxW, fmax, fmin, peso) => {
  for (let f = fmax; f >= fmin; f--) {
    ctx.font = peso + ' ' + f + 'px ' + SANS;
    if (lista.every(s => cabeEnDos(ctx, s, maxW))) return f;
  }
  return fmin;
};
const fitText = (ctx, s, maxW) => {
  s = String(s); if (ctx.measureText(s).width <= maxW) return s;
  while (s.length > 2 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s + '…';
};
function cargarFoto(url) {
  return new Promise(res => {
    if (!url) return res(null);
    const im = new Image();
    if (/^https?:/.test(url)) im.crossOrigin = 'anonymous';
    const to = setTimeout(() => res(null), 3500);
    im.onload = () => { clearTimeout(to); res(im); };
    im.onerror = () => { clearTimeout(to); res(null); };
    im.src = url;
  });
}
async function dibujarYExportar(usarFotos) {

  const aeS = (window.AtlasEditor && window.AtlasEditor.getConfig) ? window.AtlasEditor.getConfig() : null;
  const txS = (aeS && aeS.texts && aeS.texts[en() ? 'en' : 'es']) || {};

  y += 2; ctx.fillStyle = PNG.soft; ctx.font = 'italic 32px ' + SERIF;   // Source Serif 4 italica de la casa
  wrapText(ctx, subPng, W).slice(0, 2).forEach(l => { ctx.fillText(l, PAD, y); y += 42; });
  y += 12;
  const colP = 200, colF = Math.floor((W - colP) / 3);
  const bottom = PNG.H - 148;
  // encabezado de columnas + regla gruesa
  ctx.font = '700 23px ' + SANS; ctx.fillStyle = PNG.muted; ctx.textAlign = 'left';
  ctx.fillText(t('pod-col-pais').toUpperCase(), PAD, y + 28);
  (en() ? ['1st', '2nd', '3rd'] : ['1°', '2°', '3°']).forEach((s, k) => {
    ctx.fillText(s, PAD + colP + k * colF + 4, y + 28);

  y += 44;
  ctx.strokeStyle = PNG.ink; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(PAD + W, y); ctx.stroke();

  const rowH = Math.min(104, Math.floor((bottom - y) / Math.max(shown.length, 1)));
  const fotos = [];

    const urls = [];

    const ims = await Promise.all(urls.map(cargarFoto));
    let k = 0; shown.forEach(p => { fotos.push(p.figs.map(() => ims[k++])); });
  } else shown.forEach(p => fotos.push(p.figs.map(() => null)));
  const hayFotos = fotos.some(a => a.some(Boolean));

  // columna; las figuras van siempre a 25 porque las largas se abrevian.
  const fsPais = fitFontComun(ctx, shown.map(p => paisLabel(p.i)), colP - 18, 27, 21, '700');
  const fsFig = 25;

    lp.forEach((l, li) => ctx.fillText(l, PAD, cy + 9 - (lp.length - 1) * lhP / 2 + li * lhP));

  const tx = (ae && ae.texts && ae.texts[en() ? 'en' : 'es']) || {};
  let nota = (tx.caption || '').trim() || t('pod-png-note');
  if (all.length > shown.length) nota += ' ' + tpl('pod-png-top', { n: shown.length });
  ctx.font = '700 34px ' + SANS;
  const firmaW = Math.max(ctx.measureText('El Atlas').width, (() => { ctx.font = '600 27px ' + SANS; return ctx.measureText('Daniel Schteingart').width; })());
  ctx.textAlign = 'left'; ctx.fillStyle = PNG.muted; ctx.font = '400 22px ' + SANS;

  const notaLineH = 29;

  (function () {
    const partes = t('attribution-text').split('·').map(x => x.trim()).filter(Boolean);

async function exportPng() {
