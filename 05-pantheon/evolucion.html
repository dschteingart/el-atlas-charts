<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Atlas — De qué está hecha la fama</title>
<meta name="description" content="La composición de las figuras célebres por período de nacimiento, desde la Antigüedad hasta hoy. Gráfico interactivo de El Atlas.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="El Atlas · Cartografías del desarrollo">
<meta property="og:locale" content="es_AR">
<meta property="og:url" content="https://dschteingart.github.io/el-atlas-charts/05-pantheon/evolucion.html">
<meta property="og:title" content="De qué está hecha la fama — El Atlas N°5">
<meta property="og:description" content="Qué ocupaciones y dominios dominan la fama en cada era, del poder antiguo al deporte y el espectáculo de hoy.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lib/style.css">
<link rel="stylesheet" href="../lib/editor.css?v=1">
<link rel="stylesheet" href="./editor.css">
<style>
  .wrap-wide { max-width: 1100px; padding: 10px 20px 16px; }
  .wrap-wide header { padding-bottom: 8px; margin-bottom: 10px; }
  .wrap-wide .chart-block { margin: 10px 0 4px; }
  .wrap-wide .chart-title { margin: 0 0 2px; font-size: 18px; }
  .wrap-wide .chart-subtitle { margin: 0 0 8px; font-size: 13.5px; }
  .ex-controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 22px; margin: 4px 0 8px; }
  .ex-ctrl label { display: block; font-family: var(--sans); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-muted); font-weight: 600; margin-bottom: 4px; }
  .m-mode-toggle { display: inline-flex; gap: 4px; padding: 3px; background: var(--bg-soft); border-radius: 7px; }
  .m-mode-toggle button { background: transparent; border: none; padding: 5px 12px; font-family: var(--sans); font-size: 12px; color: var(--ink-soft); cursor: pointer; border-radius: 5px; font-weight: 500; transition: all .15s ease; }
  .m-mode-toggle button:hover { color: var(--ink); }
  .m-mode-toggle button.active { background: var(--bg); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .m-search-wrap { margin: 0; width: 230px; }
  .evo-sel { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .m-selected-chips { margin: 0; }
  .mini { font-family: var(--sans); font-size: 12px; padding: 5px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); color: var(--ink-soft); cursor: pointer; }
  .mini:hover { border-color: var(--accent); color: var(--accent); }
  .chart-svg-wrap svg { width: 100%; height: auto; display: block; }
  @media (min-width: 769px) { .chart-svg-wrap svg { max-height: calc(100vh - 320px); min-height: 340px; } }
  /* doble slider de periodo (mismo patron que el podio) */
  .anios { display: flex; align-items: center; gap: 8px; }
  .anios input[type=number] { font-family: var(--sans); font-size: 13px; width: 88px; padding: 5px 6px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); color: var(--ink); }
  .dual { position: relative; width: 190px; height: 26px; }
  .dual .track { position: absolute; top: 11.5px; left: 0; right: 0; height: 3px; background: var(--rule); border-radius: 2px; }
  .dual .fill { position: absolute; top: 11.5px; height: 3px; background: var(--accent); border-radius: 2px; }
  .dual input[type=range] { position: absolute; left: 0; top: 0; width: 100%; height: 26px; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
  .dual input[type=range]::-webkit-slider-runnable-track { height: 3px; background: transparent; }
  .dual input[type=range]::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--rule); cursor: pointer; margin-top: -6.5px; }
  .dual input[type=range]::-moz-range-track { height: 3px; background: transparent; }
  .dual input[type=range]::-moz-range-thumb { pointer-events: auto; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--rule); cursor: pointer; }
  @media (max-width: 768px) {
    .wrap-wide .chart-title { font-size: 19px; font-weight: 700; line-height: 1.2; margin: 0 0 4px; }
    .wrap-wide .chart-subtitle { font-size: 12px; font-weight: 400; color: var(--ink-muted); line-height: 1.4; margin: 0 0 8px; }
    .footer .sources, .footer .attribution { font-size: 10.5px; }
    .footer .download { font-size: 11px; padding: 6px 10px; }
    .m-desktop-only { display: none; }
  }
</style>
</head>
<body>
<div class="wrap wrap-wide">
  <header>
    <div class="top-bar">
      <div class="brand"><span class="brand-em" data-i18n="brand-name">El Atlas</span> · <span data-i18n="issue-num">N° 5</span></div>
      <div class="lang-toggle"><button data-lang="es" class="active">ES</button><button data-lang="en">EN</button></div>
    </div>
  </header>

  <section class="chart-block" data-chart="evo" data-editor-id="evolucion-fama">
    <h2 class="chart-title" data-i18n="cevo-title">De qué está hecha la fama</h2>
    <p class="chart-subtitle">…</p>

    <div class="ex-controls">
      <div class="ex-ctrl"><label data-i18n="cevo-lbl-medida">Medida</label>
        <div class="m-mode-toggle" id="evo-mode">
          <button class="active" data-mode="share" data-i18n="cevo-share">% del período</button>
          <button data-mode="abs" data-i18n="cevo-abs">Cantidades</button>
        </div>
      </div>
      <div class="ex-ctrl"><label data-i18n="cevo-lbl-periodo">Nacidos entre</label>
        <div class="anios">
          <input type="number" id="evo-y0" step="1" placeholder="Pre-1500">
          <div class="dual">
            <div class="track"></div><div class="fill" id="evo-fill"></div>
            <input type="range" id="evo-r0" min="0" max="11" step="1">
            <input type="range" id="evo-r1" min="0" max="11" step="1">
          </div>
          <input type="number" id="evo-y1" step="1" placeholder="Post-2000">
        </div>
      </div>
      <div class="ex-ctrl"><label data-i18n="cevo-lbl-nivel">Apertura</label>
        <div class="m-mode-toggle" id="evo-nivel">
          <button class="active" data-nivel="dom" data-i18n="cevo-doms">Dominios</button>
          <button data-nivel="occ" data-i18n="cevo-occs">Ocupaciones</button>
        </div>
      </div>
      <div class="ex-ctrl" style="flex:1 1 340px">
        <label data-i18n="cevo-lbl-sel">Países o regiones</label>
        <div class="evo-sel">
          <div class="m-search-wrap">
            <input type="text" id="evo-search" class="m-search-input" placeholder="Buscar país o región…" autocomplete="off">
            <div id="evo-search-results" class="m-search-results"></div>
          </div>
          <div class="m-selected-chips" id="evo-chips"></div>
          <button class="atlas-clear-btn" id="evo-limpiar" data-i18n="cevo-limpiar">Limpiar</button>
        </div>
      </div>
    </div>

    <div class="chart-svg-wrap">
      <svg id="chartevo" viewBox="0 0 1100 640" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="tooltip" id="tooltipevo"></div>
    </div>
  </section>

  <div class="footer">
    <p><button class="download" data-chart="evo-csv" data-i18n="footer-download">Descargar datos (CSV)</button> <button class="download" data-png="evo" data-i18n="footer-download-png">Descargar PNG</button></p>
    <div class="footer-row">
      <p class="sources" data-i18n="cevo-note">…</p>
    </div>
    <div class="footer-row">
      <p class="sources" data-i18n="cevo-sources">Datos: Pantheon (Datawheel).</p>
      <a class="attribution" href="https://elatlas.substack.com" target="_blank" rel="noopener" data-i18n="attribution-text" data-i18n-href="attribution-href">El Atlas · Daniel Schteingart</a>
    </div>
  </div>
</div>

<script src="../lib/i18n.js"></script>
<script src="../lib/regions.js"></script>
<script src="./i18n-issue.js?v=18"></script>
<script src="./utils.js?v=4"></script>
<script src="./data-evolucion.js?v=10"></script>
<script src="./evolucion.js?v=11"></script>
<script src="./png-export.js?v=4"></script>
<script>
  initEvo();
  applyI18n();
  setupLangToggle(() => { applyI18n(); ev_renderChips(); drawEvo(); });
</script>
<script src="../lib/editor.js?v=8"></script>
</body>
</html>
