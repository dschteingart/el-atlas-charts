<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  .wrap-wide { max-width: 1100px; padding: 10px 20px 16px; }
  .wrap-wide header { padding-bottom: 8px; margin-bottom: 10px; }
  .wrap-wide .chart-block { margin: 10px 0 4px; }
  .wrap-wide .chart-title { margin: 0 0 2px; font-size: 18px; }
  .wrap-wide .chart-subtitle { margin: 0 0 8px; font-size: 13.5px; }
  .controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 22px; margin: 4px 0 8px; }
  .ctl label { display: block; font-family: var(--sans); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-muted); font-weight: 600; margin-bottom: 4px; }
  .seg { display: inline-flex; gap: 4px; padding: 3px; background: var(--bg-soft); border-radius: 7px; }
  .seg button { background: transparent; border: none; padding: 5px 12px; font-family: var(--sans); font-size: 12px; color: var(--ink-soft); cursor: pointer; border-radius: 5px; font-weight: 500; transition: all .15s ease; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--bg); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  select { font-family: var(--sans); font-size: 13px; padding: 6px 9px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); color: var(--ink); max-width: 230px; }
  /* periodo universal: doble slider + cajitas (criterio de la casa) */
  .anios { display: flex; align-items: center; gap: 8px; }
  .anios input[type=number] { font-family: var(--sans); font-size: 12.5px; width: 60px; padding: 4px 6px; border: 1px solid var(--rule); border-radius: 7px; background: var(--bg); color: var(--ink); }
  .dual { position: relative; width: 180px; height: 26px; }
  .dual .track { position: absolute; top: 11.5px; left: 0; right: 0; height: 3px; background: var(--rule); border-radius: 2px; }
  .dual .fill { position: absolute; top: 11.5px; height: 3px; background: var(--accent); border-radius: 2px; }
  .dual input[type=range] { position: absolute; left: 0; top: 0; width: 100%; height: 26px; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
  .dual input[type=range]::-webkit-slider-runnable-track { height: 3px; background: transparent; }
  .dual input[type=range]::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--rule); cursor: pointer; margin-top: -6.5px; }
  .dual input[type=range]::-moz-range-track { height: 3px; background: transparent; }
  .dual input[type=range]::-moz-range-thumb { pointer-events: auto; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--rule); cursor: pointer; }
  /* buscador de paises: el de la casa (lib/style.css .m-search-*) */
  .m-search-wrap { position: relative; min-width: 210px; max-width: 260px; }
  .m-selected-chips { margin: 2px 0 6px; }
  /* grafico + tooltip oscuro de la casa */
  .chart-svg-wrap { position: relative; }
  .chart-svg-wrap svg { width: 100%; height: auto; display: block; }
  #compTip { position: absolute; display: none; pointer-events: none; background: var(--ink); color: #fff; font-family: var(--sans); font-size: 11.5px; line-height: 1.5; padding: 9px 12px; border-radius: 4px; max-width: 260px; z-index: 10; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  #compTip strong { display: block; font-family: var(--serif); font-size: 13.5px; font-weight: 600; margin-bottom: 2px; }
  #compTip .tt-period { color: #C9C2B2; font-size: 9.5px; text-transform: uppercase; letter-spacing: .9px; margin-bottom: 6px; }
  #compTip .tt-row { display: flex; justify-content: space-between; gap: 14px; }
  #compTip .tt-row span:first-child { color: #C9C2B2; }
  #compTip .tt-row span:last-child { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }
  @media (max-width: 768px) {
    .wrap-wide .chart-title { font-size: 19px; font-weight: 700; line-height: 1.2; margin: 0 0 4px; }
    .wrap-wide .chart-subtitle { font-size: 12px; font-weight: 400; color: var(--ink-muted); line-height: 1.4; margin: 0 0 8px; }
    .m-search-wrap { max-width: 100%; }
    .footer .sources, .footer .attribution { font-size: 10.5px; }
    .footer .download { font-size: 11px; padding: 6px 10px; }
  }
</style>
</head>
<body>
<div class="wrap wrap-wide">
  <header>
    <div class="top-bar">
      <div class="brand"><span class="brand-em" data-i18n="brand-name">El Atlas</span> · <span class="brand-topic" data-i18n="brand-topic">Fama</span></div>
      <div class="lang-toggle"><button data-lang="es" class="active">ES</button><button data-lang="en">EN</button></div>
    </div>
  </header>

  <section class="chart-block" data-chart="comp" data-editor-id="composicion-fama">
    <h2 class="chart-title" data-i18n="ccomp-title">Los famosos latinoamericanos son mayormente deportistas</h2>
    <p class="chart-subtitle" id="compSub">…</p>

    <div class="controls">
      <div class="ctl"><label data-i18n="ccomp-lbl-vista">Vista</label>
        <div class="seg" id="comp-view">
          <button data-val="country" data-i18n="ccomp-pais">País</button>
          <button data-val="region" data-i18n="ccomp-region">Región</button>
        </div>
      </div>
      <div class="ctl"><label data-i18n="ccomp-lbl-medida">Medida</label>
        <div class="seg" id="comp-measure">
          <button data-val="share" data-i18n="ccomp-share">% del total</button>
          <button data-val="abs" data-i18n="ccomp-abs">Absoluto</button>
          <button data-val="percap" data-i18n="ccomp-percap">Per cápita</button>
        </div>
      </div>
      <div class="ctl"><label data-i18n="ccomp-lbl-apertura">Apertura</label>
        <div class="seg" id="comp-breakdown">
          <button data-val="total" data-i18n="ccomp-total">Total</button>
          <button data-val="dom" data-i18n="ccomp-rubros">Rubros</button>
          <button data-val="occ" data-i18n="ccomp-ocupaciones">Ocupaciones</button>
        </div>
      </div>
      <div class="ctl" id="comp-domwrap"><label data-i18n="ccomp-lbl-rubro">Rubro</label>
        <select id="comp-domain"></select>
      </div>
      <div class="ctl"><label data-i18n="ccomp-lbl-periodo">Nacidos entre</label>
        <div class="anios">
          <input type="number" id="comp-y0" step="1" placeholder="−3500">
          <div class="dual">
            <div class="track"></div><div class="fill" id="comp-fill"></div>
            <input type="range" id="comp-r0" min="0" max="1000" step="1">
            <input type="range" id="comp-r1" min="0" max="1000" step="1">
          </div>
          <input type="number" id="comp-y1" step="1" placeholder="2021">
        </div>
      </div>
      <div class="ctl" id="comp-paises"><label data-i18n="ccomp-lbl-paises">Países</label>
        <div class="m-search-wrap">
          <input type="text" id="comp-search" class="m-search-input" data-i18n-placeholder="ccomp-buscar" placeholder="Agregar país…" autocomplete="off">
          <div id="comp-search-results" class="m-search-results"></div>
        </div>
      </div>
    </div>
    <div class="m-selected-chips" id="comp-selected-chips"></div>

    <div class="chart-svg-wrap">
      <svg id="chartcomp" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="compTip"></div>
    </div>
  </section>

  <div class="footer">
    <p><button class="download" data-chart="comp-csv" data-i18n="footer-download">Descargar datos (CSV)</button> <button class="download" data-png="comp" data-i18n="footer-download-png">Descargar PNG</button></p>
    <div class="footer-row">
      <p class="sources" data-i18n="ccomp-sources">Datos: Pantheon (Datawheel).</p>
      <a class="attribution" href="https://elatlas.substack.com" target="_blank" rel="noopener" data-i18n="attribution-text" data-i18n-href="attribution-href">El Atlas · Daniel Schteingart</a>
    </div>
  </div>
</div>

<script src="../lib/regions.js"></script>
<script src="../lib/i18n.js"></script>
<script src="./i18n-issue.js?v=32"></script>
<script src="./utils.js?v=7"></script>
<script src="./country-names.js?v=2"></script>
<script src="./data-percap-map.js?v=10"></script>
<script src="./data-percap-pop.js?v=4"></script>

<script src="./png-export.js?v=9"></script>

  applyI18n();
  if (typeof setupLangToggle === 'function') setupLangToggle(() => { applyI18n(); if (window.__compRelang) window.__compRelang(); });
</script>
<div id="chart-nav"></div>
<script src="./nav.js?v=4"></script>
<script src="../lib/editor.js?v=8"></script>
</body>
</html>
