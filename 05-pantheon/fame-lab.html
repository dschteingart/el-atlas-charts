<style>
  .wrap-lab { max-width: 1180px; margin: 0 auto; padding: 16px 20px 40px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  .lab-sub { font-family: var(--sans); font-size: 13px; color: var(--ink-muted); margin: 0 0 16px; }

  @media (max-width: 880px) { .lab-grid { grid-template-columns: 1fr; } }
  .panel { background: var(--bg); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; }
  .panel h2 { font-family: var(--sans); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-muted); margin: 0 0 10px; }

  .presets button { font-family: var(--sans); font-size: 12px; font-weight: 600; padding: 6px 11px; border: 1px solid var(--rule); border-radius: 20px; background: var(--bg-soft); color: var(--ink); cursor: pointer; }
  .presets button:hover { border-color: var(--accent); color: var(--accent); }
  .presets button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .knob { margin-bottom: 11px; }
  .knob-top { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--sans); }
  .knob-top label { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .knob-top .v { font-size: 12px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .knob-top .hint { font-size: 10.5px; color: var(--ink-muted); font-weight: 400; }
  .knob input[type=range] { width: 100%; margin: 4px 0 0; accent-color: var(--accent); }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .filters .full { grid-column: 1 / -1; }
  .filters label { display: block; font-family: var(--sans); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-muted); margin-bottom: 3px; }
  .filters select, .filters input { width: 100%; font-family: var(--sans); font-size: 13px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 7px; background: var(--bg-soft); color: var(--ink); box-sizing: border-box; }
  .period { display: flex; gap: 8px; align-items: center; }
  .formula { font-family: var(--sans); font-size: 11.5px; color: var(--ink-muted); margin: 10px 0 0; line-height: 1.5; background: var(--bg-soft); padding: 9px 11px; border-radius: 8px; }
  .sentinels { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
  .sent { font-family: var(--sans); font-size: 12px; padding: 5px 10px; border-radius: 8px; background: var(--bg-soft); border: 1px solid var(--rule); }
  .sent b { color: var(--accent); font-variant-numeric: tabular-nums; }
  .sent .nm { color: var(--ink); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-family: var(--sans); }
  th, td { text-align: left; padding: 6px 8px; font-size: 13px; border-bottom: 1px solid var(--rule); }
  th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-muted); font-weight: 700; }
  th.s { cursor: pointer; } th.s:hover { color: var(--ink); }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }

  tr.hl td { background: rgba(190,93,50,.09); }

<body>
<div class="wrap wrap-lab">
  <header>
    <div class="top-bar">
      <div class="brand"><span class="brand-em" data-i18n="brand-name">El Atlas</span> · <span data-i18n="issue-num">N° 5</span></div>
      <div class="lang-toggle"><button data-lang="es" class="active">ES</button><button data-lang="en">EN</button></div>
    </div>

  <div class="lab-grid">

        <button data-p="pub" class="on" data-i18n="clab-p-pub">Publicado (T40) ★</button>

        <div><label data-i18n="clab-f-occ">Ocupación</label><select id="f-occ"><option value="-1">Todas</option></select></div>
        <div><label data-i18n="clab-f-reg">Región</label><select id="f-reg"><option value="-1">Todas</option></select></div>
        <div><label data-i18n="clab-f-cty">País</label><select id="f-cty"><option value="-1">Todos</option></select></div>
        <div class="full"><label data-i18n="clab-f-per">Período de nacimiento</label><div class="period"><input type="number" id="f-y0" step="10"> <span style="color:var(--ink-muted)">→</span> <input type="number" id="f-y1" step="10"></div></div>
        <div class="full"><label style="text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink);cursor:pointer;display:flex;gap:7px;align-items:baseline;"><input type="checkbox" id="f-multi" style="width:auto;"> <span data-i18n="clab-f-multi">Solo multiidioma</span> <span style="color:var(--ink-muted);font-weight:400;font-size:10.5px;" data-i18n="clab-f-multi-h">(2 idiomas o más con 1.000 visitas o más desde 2015)</span></label></div>

        <div id="count" style="font-family:var(--sans);font-size:12px;color:var(--ink-muted);margin:8px 2px;"></div>
        <table><thead><tr>
          <th class="rk">#</th><th data-i18n="clab-th-fig">Figura</th><th data-i18n="clab-th-occ">Ocupación</th><th class="num" data-i18n="clab-th-nac">Nac.</th>
          <th class="num s" data-c="Lenguas" data-i18n="clab-th-len" data-i18n-title="clab-tt-len">Lenguas</th>
          <th class="num s" data-c="Vistas" data-i18n="clab-th-vis" data-i18n-title="clab-tt-vis">Vistas</th>
          <th class="num s" data-c="ageMult" data-i18n="clab-th-edad" data-i18n-title="clab-tt-edad">Edad×</th>
          <th class="num s" data-c="score" data-i18n="clab-th-score" data-i18n-title="clab-tt-score">Score</th>
        </tr></thead><tbody id="rows"></tbody></table>
      </div>
    </div>
  </div>
  <a class="lab-volver" href="./index.html" data-i18n="clab-volver">← Volver a los gráficos</a>
</div>

<script src="../lib/i18n.js"></script>
<script src="./i18n-issue.js?v=31"></script>
<script src="./data-fame-lab.js?v=6"></script>
<script>
const D=window.FAMELAB, N=D.figs.length, LN4=Math.log(4), REF=D.refYear;
const C={}; D.cols.forEach((c,i)=>C[c]=i);
const nm=[],occ=new Int16Array(N),by=new Int16Array(N),cty=new Int16Array(N),dom=new Int8Array(N),multi=new Int8Array(N);
const lnNL=new Float64Array(N),lnL10=new Float64Array(N),lnV12=new Float64Array(N),lnVA=new Float64Array(N),lnMed=new Float64Array(N);
for(let i=0;i<N;i++){const f=D.figs[i]; nm[i]=f[C.name]; occ[i]=f[C.occIdx]; by[i]=f[C.birthyear]; cty[i]=f[C.ctyIdx]; dom[i]=D.occDom[f[C.occIdx]];
  lnNL[i]=Math.log1p(f[C.n_langs]); lnL10[i]=Math.log1p(f[C.langs10k]); lnV12[i]=Math.log1p(f[C.total12]); lnVA[i]=Math.log1p(f[C.total_all]); lnMed[i]=Math.log1p(f[C.median]); multi[i]=C.multi==null?1:f[C.multi]; }
const mx=a=>{let m=0;for(let i=0;i<N;i++)if(a[i]>m)m=a[i];return m||1;};
const MNL=mx(lnNL),ML10=mx(lnL10),MV12=mx(lnV12),MVA=mx(lnVA),MMED=mx(lnMed);
// normalizados [0,1] (constantes)
const nNL=new Float64Array(N),nL10=new Float64Array(N),nV12=new Float64Array(N),nVA=new Float64Array(N),nMed=new Float64Array(N);
for(let i=0;i<N;i++){nNL[i]=lnNL[i]/MNL;nL10[i]=lnL10[i]/ML10;nV12[i]=lnV12[i]/MV12;nVA[i]=lnVA[i]/MVA;nMed[i]=lnMed[i]/MMED;}
const nameIdx={};for(let i=0;i<N;i++)if(!(nm[i] in nameIdx))nameIdx[nm[i]]=i;  // primera aparición (mayor vistas) por nombre

const TT=(k,f)=>(typeof t==='function' && t(k)!==k) ? t(k) : f;
const EN=()=>(typeof LANG!=='undefined'&&LANG==='en');
// Rotulos del dato en los dos idiomas. Rubros, ocupaciones y paises vienen con su
// par es/en desde data-fame-lab.js; las regiones viajan con su clave canonica y se
// traducen con la misma tabla que el mapa y composicion.
const LBL=o=>(o&&typeof o==='object')?(EN()?o.en:o.es):o;
const REG_LABEL={
  'Latin America':['América Latina','Latin America'],'Caribbean':['Caribe','Caribbean'],
  'Western Europe':['Europa Occidental','Western Europe'],'Eastern Europe & Central Asia':['Europa del Este y Asia Central','Eastern Europe & C. Asia'],
  'North America, Australia & New Zealand':['Norteamérica y Oceanía','N. America & Oceania'],'East Asia':['Asia Oriental','East Asia'],
  'Southeast Asia':['Sudeste Asiático','Southeast Asia'],'South Asia':['Asia del Sur','South Asia'],
  'Middle East & North Africa':['Medio Oriente y N. de África','Middle East & N. Africa'],'Sub-Saharan Africa':['África Subsahariana','Sub-Saharan Africa']};
const regLabel=k=>REG_LABEL[k]?REG_LABEL[k][EN()?1:0]:k;
const KNOBS=[
  {k:'T',min:0,max:100,step:5},{k:'piso',min:0,max:1,step:.05},
  {k:'wA',min:0,max:2,step:.1},{k:'wRec',min:0,max:2,step:.1},
];
const PRESETS={pub:{T:40,piso:.5,wA:1,wRec:1,geom:true},hpi:{T:70,piso:.5,wA:1,wRec:1,geom:true},noage:{T:40,piso:1,wA:1,wRec:1,geom:true},simple:{T:40,piso:.5,wA:1,wRec:1,geom:false}};
let W=Object.assign({},PRESETS.pub), mode='pub';
const kc=document.getElementById('knobs');
KNOBS.forEach(kn=>{const d=document.createElement('div');d.className='knob';
  d.innerHTML=`<div class="knob-top"><label><span data-knob-lbl="${kn.k}"></span> <span class="hint">· <span data-knob-hint="${kn.k}"></span></span></label><span class="v" id="v-${kn.k}"></span></div><input type="range" id="i-${kn.k}" min="${kn.min}" max="${kn.max}" step="${kn.step}">`;
  kc.appendChild(d); d.querySelector('input').addEventListener('input',e=>{W[kn.k]=+e.target.value;mode='custom';syncP();render();});});
function syncK(){KNOBS.forEach(kn=>{document.getElementById('i-'+kn.k).value=W[kn.k];document.getElementById('v-'+kn.k).textContent=kn.step>=1?Math.round(W[kn.k]):(+W[kn.k]).toFixed(2);});document.getElementById('geom').checked=W.geom;}
function syncP(){document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('on',b.dataset.p===mode));}
document.querySelectorAll('#presets button').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.p;W=Object.assign({},PRESETS[mode]);syncK();syncP();render();}));
document.getElementById('geom').addEventListener('change',e=>{W.geom=e.target.checked;mode='custom';syncP();render();});

const fdom=document.getElementById('f-dom'),focc=document.getElementById('f-occ'),freg=document.getElementById('f-reg'),fcty=document.getElementById('f-cty'),fy0=document.getElementById('f-y0'),fy1=document.getElementById('f-y1'),fmulti=document.getElementById('f-multi');
function fillDom(){const v=fdom.value;fdom.innerHTML='<option value="-1">'+TT('clab-todos','Todos')+'</option>';D.doms.forEach((x,i)=>fdom.add(new Option(LBL(x),i)));fdom.value=v||'-1';}
function fillReg(){const v=freg.value;freg.innerHTML='<option value="-1">'+TT('clab-todas','Todas')+'</option>';(D.regs||[]).forEach((x,i)=>freg.add(new Option(regLabel(x),i)));freg.value=v||'-1';}
fillDom();fillReg();
function fillOcc(){const dv=+fdom.value,lc=EN()?'en':'es';focc.innerHTML='<option value="-1">'+TT('clab-todas','Todas')+'</option>';D.occs.map((o,i)=>[LBL(o),i]).filter(([o,i])=>dv<0||D.occDom[i]===dv).sort((a,b)=>a[0].localeCompare(b[0],lc)).forEach(([o,i])=>focc.add(new Option(o,i)));}
function fillCty(){const rv=+freg.value,CR=D.ctyReg||[],lc=EN()?'en':'es';fcty.innerHTML='<option value="-1">'+TT('clab-todos','Todos')+'</option>';(D.ctys||[]).map((c,i)=>[LBL(c),i]).filter(([c,i])=>rv<0||CR[i]===rv).sort((a,b)=>a[0].localeCompare(b[0],lc)).forEach(([c,i])=>fcty.add(new Option(c,i)));}
fillOcc();fillCty();
let minB=9999,maxB=-9999;for(let i=0;i<N;i++){if(by[i]<minB)minB=by[i];if(by[i]>maxB)maxB=by[i];}
fy0.value=minB;fy1.value=maxB;
[fdom,focc,freg,fcty,fy0,fy1,fmulti].forEach(el=>el.addEventListener('input',()=>{if(el===fdom)fillOcc();if(el===freg)fillCty();render();}));

let sortC='score',sortDir=-1;
document.querySelectorAll('th.s').forEach(th=>th.addEventListener('click',()=>{const c=th.dataset.c;if(sortC===c)sortDir=-sortDir;else{sortC=c;sortDir=-1;}render();}));

const SENT=['Lionel Messi','Cristiano Ronaldo','Lamine Yamal','Albert Einstein','Aristotle','Frida Kahlo','Pelé','Donald Trump'];
function geomean(v){let p=1;for(const x of v)p*=Math.max(x,1e-9);return Math.pow(p,1/v.length);}
function comb(v){return W.geom?geomean(v):v.reduce((a,b)=>a+b,0)/v.length;}

function compute(){
  // edad: min/max de ageRaw sobre TODA la base (estable)
  const ar=new Float64Array(N);let amn=1e9,amx=-1e9;
  const T=W.T,wA=W.wA,wRec=W.wRec;
  for(let i=0;i<N;i++){const A=Math.max(1,REF-by[i]);const v=wA*Math.log(A)/LN4 - wRec*Math.max(0,(T-A)/7);ar[i]=v;if(v<amn)amn=v;if(v>amx)amx=v;}
  const rng=(amx-amn)||1, piso=W.piso, kAge=(1-piso)/rng, geom=W.geom;
  const Leng=new Float64Array(N),Vis=new Float64Array(N),age=new Float64Array(N),sc=new Float64Array(N);
  let smax=0;
  for(let i=0;i<N;i++){
    const ag=piso+kAge*(ar[i]-amn); age[i]=ag;
    let L,V,base;
    // Lenguas: media ARITMETICA siempre. El 58,9% de la base tiene 0 idiomas con
    // >=10k vistas; con geometrica ese cero anulaba el score y dejaba a media base
    // pegada a ~0,3 con un acantilado a 42. Ver export_dataset.py.
    L=(nNL[i]+nL10[i])/2;
    if(geom){
      V=Math.cbrt(Math.max(nV12[i],1e-9)*Math.max(nVA[i],1e-9)*Math.max(nMed[i],1e-9));
      base=Math.sqrt(Math.max(L,1e-9)*Math.max(V,1e-9));
    }else{
      V=(nV12[i]+nVA[i]+nMed[i])/3; base=(L+V)/2;
    }
    Leng[i]=L; Vis[i]=V;
    const s=base*ag; sc[i]=s; if(s>smax)smax=s;
  }
  // score 0–100 normalizado por el MÁXIMO GLOBAL → depende solo de las perillas, nunca del filtro
  smax=smax||1;const f=100/smax;for(let i=0;i<N;i++)sc[i]*=f;
  return {Leng,Vis,age,sc};
}
function render(){
  syncK();
  document.getElementById('formula').innerHTML=`Score = ${W.geom?'geom':'media'}(Lenguas, Vistas) × Edad · <b>Lenguas</b>: media(idiomas, idiomas≥10k) · <b>edad</b>: ${W.wA}·log₄A − ${W.wRec}·pen(T=${Math.round(W.T)}), piso ${(+W.piso).toFixed(2)}`;
  const M=compute();
  const key={Lenguas:M.Leng,Vistas:M.Vis,ageMult:M.age,score:M.sc}[sortC];
  // rango GLOBAL en la dimensión de orden (1 = mayor), contado sólo para las filas visibles (evita ordenar 123k). El filtro solo oculta filas.
  const grankOf=i=>{const ki=key[i];let r=1;for(let j=0;j<N;j++)if(key[j]>ki)r++;return r;};
  const dv=+fdom.value,ov=+focc.value,rv=+freg.value,cv=+fcty.value,y0=+fy0.value,y1=+fy1.value,mu=fmulti.checked,CR=D.ctyReg||[];
  const idx=[];
  for(let i=0;i<N;i++){if(mu&&!multi[i])continue; if(ov>=0){if(occ[i]!==ov)continue;}else if(dv>=0&&dom[i]!==dv)continue;
    if(cv>=0){if(cty[i]!==cv)continue;}else if(rv>=0){const cr=cty[i]>=0?CR[cty[i]]:-1;if(cr!==rv)continue;}
    if(by[i]<y0||by[i]>y1)continue; idx.push(i);}
  idx.sort((a,b)=>sortDir*(key[a]-key[b]));
  const loc=(typeof LANG!=='undefined'&&LANG==='en')?'en-US':'es-AR';
  document.getElementById('count').textContent=TT('clab-count','{n} figuras en la vista').replace('{n}', idx.length.toLocaleString(loc));
  const tb=document.getElementById('rows');tb.innerHTML='';
  idx.slice(0,40).forEach(i=>{const tr=document.createElement('tr');if(SENT.includes(nm[i]))tr.className='hl';
    tr.innerHTML=`<td class="rk">${grankOf(i)}</td><td>${nm[i]}</td><td style="color:var(--ink-soft)">${LBL(D.occs[occ[i]])}</td>`+
      `<td class="num">${by[i]<0?Math.abs(by[i])+' '+TT('clab-bc','a.C.'):by[i]}</td><td class="num">${M.Leng[i].toFixed(2)}</td><td class="num">${M.Vis[i].toFixed(2)}</td>`+
      `<td class="num">${M.age[i].toFixed(2)}</td><td class="num sc">${M.sc[i].toFixed(1)}</td>`;
    tb.appendChild(tr);});
  // sentinels: rango global por SCORE (contado, sin sort completo)
  const sc2=document.getElementById('sentinels');sc2.innerHTML='';
  SENT.forEach(name=>{const fi=nameIdx[name];let rk='—';
    if(fi!=null){const si=M.sc[fi];let r=1;for(let j=0;j<N;j++)if(M.sc[j]>si)r++;rk='#'+r;}
    const d=document.createElement('div');d.className='sent';
    d.innerHTML=`<span class="nm">${name.split(' ').slice(-1)[0]}</span> <b>${rk}</b>`;sc2.appendChild(d);});
}
function aplicarIdioma(){
  KNOBS.forEach(kn=>{
    const l=document.querySelector('[data-knob-lbl="'+kn.k+'"]'), h=document.querySelector('[data-knob-hint="'+kn.k+'"]');
    if(l) l.textContent=TT('clab-k-'+kn.k, kn.k);
    if(h) h.textContent=TT('clab-k-'+kn.k+'-h', '');
  });
  const tt=document.querySelector('title');
  if(tt&&tt.dataset.titleEn){ if(!tt.dataset.titleEs) tt.dataset.titleEs=tt.textContent;
    tt.textContent = EN()? tt.dataset.titleEn : tt.dataset.titleEs; }
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{
    const v=TT(el.dataset.i18nTitle,''); if(v) el.setAttribute('title',v);
  });
  const dv=fdom.value, rv=freg.value, ov=focc.value, cv=fcty.value;
  fillDom(); fillReg(); fdom.value=dv; freg.value=rv;
  fillOcc(); fillCty(); focc.value=ov; fcty.value=cv;
}
